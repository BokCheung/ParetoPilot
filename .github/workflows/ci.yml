name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: paretopilot --version
      - run: python -m unittest discover -s tests
      - run: python -m paretopilot tune-kernel --config examples/matmul.demo.json --output runs/ci-matmul
      - run: python -m paretopilot tune-kernel --config examples/elementwise.demo.json --output runs/ci-elementwise

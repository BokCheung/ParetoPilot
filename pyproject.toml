[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paretopilot"
version = "1.0.0"
description = "Roofline-guided Ascend kernel genetic optimization through OM profiling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
paretopilot = "paretopilot.cli:main"

[tool.setuptools.packages.find]
include = ["paretopilot*"]
